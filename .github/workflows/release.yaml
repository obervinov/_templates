---
name: Release template

on: [workflow_call]  # yamllint disable-line rule:truthy

jobs:
  release-template:
    runs-on: ubuntu-latest
    # actions/create-release supplied its own token from github.token and needed
    # no declaration. action-gh-release calls the REST API as the job, so the
    # job has to be allowed to write releases.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Extract version in CHANGELOG.md
        run: echo "version=$(grep -E '## v[0-9]?([0-9]).[0-9]?([0-9]).[0-9]?([0-9])' CHANGELOG.md | head -1 | grep -Eo 'v[0-9]?([0-9]).[0-9]?([0-9]).[0-9]?([0-9])')" >> $GITHUB_OUTPUT
        id: changelogmdversion

      - name: Project name
        run: echo "project=$(echo ${GITHUB_REPOSITORY#obervinov/})" >> $GITHUB_OUTPUT
        id: project

      - name: Changes body
        run: sed -n '/## ${{ steps.changelogmdversion.outputs.version }} /,/## v/p' CHANGELOG.md | sed '$ d' > RELEASE_BODY.tmp
        id: changes

      # actions/create-release is archived and runs on node12, which the runner
      # stops carrying on 2026-09-23. action-gh-release is the drop-in the
      # upstream README points at: same inputs, `release_name` renamed `name`,
      # and the token defaults to github.token.
      - name: Create release
        uses: softprops/action-gh-release@v3
        id: create_release
        with:
          draft: false
          prerelease: false
          name: ${{ steps.project.outputs.project }}:${{ steps.changelogmdversion.outputs.version }}
          tag_name: ${{ steps.changelogmdversion.outputs.version }}
          body_path: RELEASE_BODY.tmp

      # A consumer's README pins the package version in its install snippet, and
      # that line has to be edited by hand on every release — which is how it
      # goes stale. A major tag that follows the newest release inside its major
      # lets the snippet say `tag = "v4"` once and stop being maintained. Same
      # contract as actions/checkout@v7: the pointer moves within the major,
      # never across it, so a breaking release starts a new one and whoever
      # pinned the old major stays where they are.
      #
      # Lightweight and forced on purpose: it is a pointer, not a release. The
      # release tag created above stays immutable and is what a reproducible
      # pin uses.
      - name: Move the major tag
        env:
          VERSION: ${{ steps.changelogmdversion.outputs.version }}
        run: |
          major="${VERSION%%.*}"
          echo "Pointing $major at $VERSION ($GITHUB_SHA)"
          git tag -f "$major"
          git push -f origin "refs/tags/$major"
