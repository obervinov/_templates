---
name: Golang CI template

on: [workflow_call]  # yamllint disable-line rule:truthy

jobs:
  golang-ci-template:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # go.mod rather than 'stable': golangci-lint type-checks with the toolchain it was
      # built against, so a runner that installs a newer Go than the linter knows makes
      # it panic on the standard library — "file requires newer Go version go1.27
      # (application built with go1.26)". Following the module keeps CI on the version
      # the project actually declares, which is also what a reproducible build wants.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting with gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted, run 'gofmt -w .':"
            echo "$unformatted"
            exit 1
          fi

      - name: Analysing the code with go vet
        run: go vet ./...

      - name: Analysing the code with golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

      - name: Testing with go test
        run: go test ./... -race -cover

      - name: Building
        run: go build ./...
